apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort  # Change to ClusterIP or LoadBalancer depending on your needs
  selector:
    app: nginx    # This must match the matchLabels in the deployment file
  ports:
    - protocol: TCP
      port: 80        # The port the service exposes
      targetPort: 80  # The Nginx container listens on port 80
